<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Original illustration for Cedar Bear: fresh morning lake with forest & mountains -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6e1"/>
      <stop offset=".35" stop-color="#dcf1e6"/>
      <stop offset=".62" stop-color="#f4f6e4"/>
      <stop offset="1" stop-color="#fbf5e6"/>
    </linearGradient>
    <radialGradient id="sun" cx="74%" cy="22%" r="30%">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset=".18" stop-color="#fff3c4" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#ffeeb8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffeeb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fffbe8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9dcd3"/>
      <stop offset=".5" stop-color="#c9ebe1"/>
      <stop offset="1" stop-color="#e9f4e8"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="shore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb08a"/>
      <stop offset="1" stop-color="#5d9470"/>
    </linearGradient>
    <g id="pine"><polygon points="0,0 9,14 5,14 13,27 7,27 17,42 -17,42 -7,27 -13,27 -5,14 -9,14"/><rect x="-2" y="42" width="4" height="6"/></g>
    <g id="leaf"><path d="M0 0 C 30 -20 72 -18 100 0 C 72 18 30 20 0 0 Z"/><path d="M4 0 L 96 0" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.6" fill="none"/></g>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>
  <circle cx="1184" cy="220" r="62" fill="#fffdf1" opacity=".95"/>

  <!-- sun rays -->
  <g opacity=".55">
    <polygon points="1160,220 1210,220 980,1000 820,1000" fill="url(#ray)"/>
    <polygon points="1170,220 1200,220 1330,1000 1220,1000" fill="url(#ray)"/>
    <polygon points="1175,220 1195,220 1560,900 1500,980" fill="url(#ray)" opacity=".7"/>
  </g>

  <!-- soft clouds -->
  <g fill="#ffffff" opacity=".75">
    <ellipse cx="300" cy="170" rx="150" ry="26"/><ellipse cx="380" cy="150" rx="90" ry="30"/>
    <ellipse cx="860" cy="120" rx="120" ry="20"/><ellipse cx="920" cy="104" rx="70" ry="24"/>
    <ellipse cx="1430" cy="330" rx="130" ry="18"/>
  </g>

  <!-- mountains -->
  <path d="M0 520 L150 380 L260 450 L420 300 L560 420 L720 270 L880 410 L1020 330 L1180 430 L1360 320 L1600 440 V700 H0Z" fill="#a8cdc1"/>
  <path d="M420 300 L470 345 L440 342 L420 360 L398 335 L380 340Z M720 270 L775 320 L745 316 L720 338 L698 312 L672 318Z M1360 320 L1410 362 L1380 358 L1360 374 L1340 352 L1318 358Z" fill="#f3fbf8"/>
  <path d="M0 580 L120 500 L280 560 L450 470 L610 545 L790 470 L960 550 L1130 480 L1320 555 L1480 490 L1600 530 V700 H0Z" fill="#8fbfa6"/>
  <rect y="470" width="1600" height="170" fill="url(#mist)"/>

  <!-- forest on the far shore -->
  <g fill="#5f9a72">
    <use href="#pine" transform="translate(30 590) scale(1.5)"/><use href="#pine" transform="translate(80 600) scale(1.2)"/><use href="#pine" transform="translate(130 585) scale(1.7)"/>
    <use href="#pine" transform="translate(185 600) scale(1.25)"/><use href="#pine" transform="translate(240 592) scale(1.45)"/><use href="#pine" transform="translate(300 604) scale(1.1)"/>
    <use href="#pine" transform="translate(1210 594) scale(1.4)"/><use href="#pine" transform="translate(1262 586) scale(1.7)"/><use href="#pine" transform="translate(1320 600) scale(1.2)"/>
    <use href="#pine" transform="translate(1375 590) scale(1.55)"/><use href="#pine" transform="translate(1430 600) scale(1.25)"/><use href="#pine" transform="translate(1490 586) scale(1.75)"/>
    <use href="#pine" transform="translate(1550 598) scale(1.35)"/>
  </g>
  <g fill="#4d8862">
    <use href="#pine" transform="translate(60 615) scale(1.05)"/><use href="#pine" transform="translate(160 618) scale(.95)"/><use href="#pine" transform="translate(1290 618) scale(1)"/><use href="#pine" transform="translate(1460 616) scale(1.05)"/>
  </g>

  <!-- lake with reflections & sparkles -->
  <rect y="660" width="1600" height="180" fill="url(#lake)"/>
  <g opacity=".35" fill="#8fbfa6">
    <path d="M0 662 L120 700 L280 672 L450 712 L610 676 L790 712 L960 672 L1130 706 L1320 670 L1480 700 L1600 680 V662Z"/>
  </g>
  <g stroke="#ffffff" stroke-linecap="round" opacity=".85">
    <path d="M980 700 H1060" stroke-width="3"/><path d="M1120 716 H1250" stroke-width="3"/><path d="M1040 736 H1110" stroke-width="2.5"/>
    <path d="M1180 752 H1300" stroke-width="2"/><path d="M900 726 H950" stroke-width="2"/><path d="M1320 732 H1380" stroke-width="2"/>
    <path d="M300 720 H380" stroke-width="2" opacity=".6"/><path d="M520 744 H600" stroke-width="2" opacity=".6"/>
  </g>

  <!-- near shore meadow -->
  <path d="M0 820 Q 300 780 640 812 T 1240 800 T 1600 795 V1000 H0Z" fill="url(#shore)" opacity=".55"/>
  <path d="M0 860 Q 420 830 820 856 T 1600 846 V1000 H0Z" fill="#eef4e3"/>
  <path d="M0 920 Q 500 896 1000 918 T 1600 912 V1000 H0Z" fill="#fbf6ea"/>

  <!-- botanical leaves framing the scene -->
  <g fill="#6aa77c" opacity=".55">
    <use href="#leaf" transform="translate(-30 120) rotate(30) scale(1.9)"/>
    <use href="#leaf" transform="translate(-10 230) rotate(58) scale(1.5)"/>
    <use href="#leaf" transform="translate(20 60) rotate(6) scale(1.2)"/>
    <use href="#leaf" transform="translate(1640 900) rotate(205) scale(2)"/>
    <use href="#leaf" transform="translate(1620 990) rotate(170) scale(1.6)"/>
    <use href="#leaf" transform="translate(1585 820) rotate(228) scale(1.2)"/>
  </g>
  <g fill="#9ccfa9" opacity=".5">
    <use href="#leaf" transform="translate(60 180) rotate(40) scale(1)"/>
    <use href="#leaf" transform="translate(1560 880) rotate(195) scale(1)"/>
  </g>
</svg>
