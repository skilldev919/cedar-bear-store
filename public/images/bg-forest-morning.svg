<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4efe6"/>
      <stop offset=".45" stop-color="#f1f4ea"/>
      <stop offset="1" stop-color="#f8f3e8"/>
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="14%" r="38%">
      <stop offset="0" stop-color="#fff6dc" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#fdf3d8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fdf3d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f4ec" stop-opacity="0"/>
      <stop offset="1" stop-color="#f6f4ec" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbe9" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fffbe9" stop-opacity="0"/>
    </linearGradient>
    <g id="pine"><polygon points="0,0 9,14 5,14 13,27 7,27 17,42 -17,42 -7,27 -13,27 -5,14 -9,14"/></g>
    <g id="leaf"><path d="M0 0 C 30 -18 70 -16 96 0 C 70 16 30 18 0 0 Z"/><path d="M0 0 L 96 0" stroke="#fff" stroke-opacity=".35" stroke-width="1.4" fill="none"/></g>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>

  <!-- soft light rays -->
  <g opacity=".5">
    <polygon points="1250,0 1330,0 900,1000 760,1000" fill="url(#ray)"/>
    <polygon points="1380,0 1420,0 1180,1000 1100,1000" fill="url(#ray)"/>
  </g>

  <!-- distant mountains -->
  <path d="M0 560 L160 430 L290 500 L460 360 L600 470 L760 330 L930 470 L1090 380 L1260 480 L1430 390 L1600 470 V1000 H0Z" fill="#dce6dc"/>
  <path d="M0 620 L140 540 L300 600 L470 500 L640 590 L820 510 L990 600 L1160 530 L1340 600 L1500 540 L1600 580 V1000 H0Z" fill="#cbdacd"/>
  <rect y="480" width="1600" height="260" fill="url(#mist)"/>

  <!-- treeline -->
  <g fill="#b4c8b6">
    <use href="#pine" transform="translate(40 640) scale(1.9)"/><use href="#pine" transform="translate(110 660) scale(1.4)"/>
    <use href="#pine" transform="translate(180 630) scale(2.2)"/><use href="#pine" transform="translate(260 660) scale(1.5)"/>
    <use href="#pine" transform="translate(1280 640) scale(2)"/><use href="#pine" transform="translate(1350 660) scale(1.5)"/>
    <use href="#pine" transform="translate(1420 625) scale(2.4)"/><use href="#pine" transform="translate(1510 655) scale(1.6)"/>
    <use href="#pine" transform="translate(1570 640) scale(2.1)"/>
  </g>
  <path d="M0 760 Q 400 700 800 745 T 1600 735 V1000 H0Z" fill="#eef0e4"/>
  <path d="M0 840 Q 500 800 1000 835 T 1600 830 V1000 H0Z" fill="#f6f2e7"/>

  <!-- faint botanical leaves at the edges -->
  <g fill="#9fbfa2" opacity=".28">
    <use href="#leaf" transform="translate(-20 180) rotate(28) scale(1.6)"/>
    <use href="#leaf" transform="translate(10 260) rotate(52) scale(1.2)"/>
    <use href="#leaf" transform="translate(40 120) rotate(8) scale(1)"/>
    <use href="#leaf" transform="translate(1620 820) rotate(200) scale(1.7)"/>
    <use href="#leaf" transform="translate(1600 900) rotate(170) scale(1.3)"/>
    <use href="#leaf" transform="translate(1560 760) rotate(222) scale(1)"/>
  </g>
</svg>
